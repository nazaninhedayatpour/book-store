<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>
        Edit Review
    </title>
</head>

<body>

    <h1>
        Edit Review for {{ review.book.title }}
    </h1>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Changes
        </button>

    </form>

    <br>

    <a href="{% url 'book_detail' review.book.pk %}">
        Cancel
    </a>

</body>

</html>
