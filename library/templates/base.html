<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>
        {% block title %}
            Book Store
        {% endblock %}
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f5f1e8;
            font-family: Arial, sans-serif;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 15px 30px;
            background-color: #333;
        }

        .nav-left,
        .nav-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 17px;
        }

        .navbar a:hover {
            color: #ffd700;
        }

        .welcome {
            color: white;
            font-size: 16px;
        }

        .logout {
            color: #ff6b6b !important;
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <!-- Left Navigation -->
        <div class="nav-left">

            <a href="{% url 'home' %}">
                🏠 Home
            </a>

            <a href="{% url 'book_list' %}">
                📚 Books
            </a>

            {% if user.is_authenticated %}

                <a href="{% url 'my_favorites' %}">
                    ❤️ My Favorites
                </a>

                <a href="{% url 'cart_detail' %}">
                    🛒 Cart
                </a>

            {% endif %}

        </div>


        <!-- Right Navigation -->
        <div class="nav-right">

            {% if user.is_authenticated %}

                <span class="welcome">
                    Hello, {{ user.username }} 👋
                </span>

                <a href="{% url 'logout' %}" class="logout">
                    Logout
                </a>

            {% else %}

                <a href="{% url 'login' %}">
                    🔑 Login
                </a>

                <a href="{% url 'signup' %}">
                    ✍️ Signup
                </a>

            {% endif %}

        </div>

    </nav>

</body>

</html>
