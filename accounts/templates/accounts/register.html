<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<h1> Register </h1>

<form method="post">
    {% csrf_token %}

     {% if error %}
     <p style="color: red;">{{ error }}</p>
    {% endif %}


    <label> Username: </label>
    <input 
    type="text"
    name="username"
    required>

    <br><br>

    <label> Password: </label>
    <input 
    type="password"
    name="password"
    required>

    <br><br>

     <button type="submit">
            Register
        </button>

</form>
<body>
    
</body>
</html>
